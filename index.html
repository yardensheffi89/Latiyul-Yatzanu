<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D50">
<title>לטיול יצאנו</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="topbar__row">
      <div class="seg" role="group" aria-label="מצב">
        <button type="button" class="seg__btn" data-mode="spontaneous" aria-pressed="true">ספונטני</button>
        <button type="button" class="seg__btn" data-mode="plan" aria-pressed="false">תכנון מראש</button>
      </div>
      <button type="button" class="account" id="accountBtn" aria-label="חשבון">
        <span class="account__initial" id="accountInitial" aria-hidden="true"></span>
        <svg class="account__icon" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      </button>
    </div>
    <div class="topbar__row">
      <label class="visually-hidden" for="search">חיפוש</label>
      <input id="search" class="search" type="search" placeholder="חיפוש מסלול, אזור או מקום" autocomplete="off">
    </div>
    <div class="chips" id="chips" role="group" aria-label="סינון">
      <button type="button" class="chip" data-filter="near" aria-pressed="false">עד 45 דק'</button>
      <button type="button" class="chip" data-filter="short" aria-pressed="false">עד 3 ק"מ</button>
      <button type="button" class="chip" data-filter="stroller" aria-pressed="false">נגיש לעגלה</button>
      <button type="button" class="chip" data-filter="water" aria-pressed="false">מים</button>
      <button type="button" class="chip" data-filter="shuttle" aria-pressed="false">מתאים להקפצה</button>
      <button type="button" class="chip" data-filter="season" aria-pressed="false">בעונה עכשיו</button>
      <button type="button" class="chip" data-filter="notdone" aria-pressed="false" hidden>עוד לא עשינו</button>
    </div>
  </header>

  <main class="stage">
    <section class="view view--map" id="viewMap" aria-label="מפה">
      <div class="map" id="map"></div>
      <div class="result-count" id="resultCount" aria-live="polite"></div>
      <aside class="dock" id="dock"></aside>
    </section>

    <section class="view view--list" id="viewLodging" aria-label="לינה" hidden></section>
    <section class="view view--list" id="viewMine" aria-label="הטיולים שלנו" hidden></section>
    <section class="view view--list" id="viewPlan" aria-label="תכנון מראש" hidden></section>
  </main>

  <nav class="tabbar" aria-label="ניווט ראשי">
    <button type="button" class="tab" data-view="map" aria-current="page">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14"></path><path d="M15 6v14"></path></svg>
      <span>מפה</span>
    </button>
    <button type="button" class="tab" data-view="plan">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16"></path><path d="M9 3v4"></path><path d="M15 3v4"></path></svg>
      <span>תוכניות</span>
    </button>
    <button type="button" class="tab" data-view="lodging">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l9-15 9 15z"></path><path d="M12 20v-5"></path></svg>
      <span>לינה</span>
    </button>
    <button type="button" class="tab" data-view="mine">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"></path></svg>
      <span>הטיולים שלנו</span>
    </button>
  </nav>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet__scrim" data-close></div>
    <div class="sheet__panel" id="sheetPanel"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
